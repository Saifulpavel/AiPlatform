# দুই মোড (Docker Compose profiles দিয়ে):
#   local dev (backing only):  docker compose up -d
#     → sqlserver + redis + qdrant শুধু; API/frontend VS/dotnet/npm থেকে চালাও।
#   full stack (LB সহ):        docker compose --profile full up -d --build
#     → + api1/api2 + nginx LB। entry: http://localhost:8080
# থামাতে: docker compose down  (volume/DB থাকে; -v দিলে data-ও মুছবে)।

# দুই API replica-র shared config (DRY — YAML anchor)
x-api-common: &api-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ConnectionStrings__Default: "Server=sqlserver,1433;Database=AiPlatform;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
    Redis__Connection: "redis:6379"
    Qdrant__Url: "http://qdrant:6333"
    Jwt__SecretKey: "${JWT_SECRET}"
    # OTLP-র standard env var — exporter নিজেই পড়ে (Phase 8d)
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
  depends_on:
    sqlserver:
      condition: service_healthy
    redis:
      condition: service_healthy
    qdrant:
      condition: service_started
    aspire-dashboard:
      condition: service_started
  restart: unless-stopped

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aiplatform-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aiplatform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aiplatform-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage

  # OpenTelemetry backend (Phase 8d) — trace/metric/log দেখার UI: http://localhost:18888
  # ponytail: Aspire dashboard = এক container, শূন্য config। Grafana+Tempo+Prometheus একই জিনিসের
  # জন্য ৩ service + scrape/datasource config চায়; দরকার হলে পরে বদলানো যাবে — app শুধু OTLP জানে।
  # ⚠️ data মেমোরিতে, restart-এ মুছে যায় (dev-এ যথেষ্ট; prod-এ persistent backend লাগবে)।
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: aiplatform-aspire-dashboard
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"   # ⚠️ dev only — login ছাড়া UI খোলে
    ports:
      - "18888:18888"   # UI
      - "4317:18889"    # OTLP gRPC — host-এ চলা API এখানে পাঠায় (OTel-এর standard port)

  # stateless API — দুই replica (state Redis/SQL-এ, তাই যেকোনো replica যেকোনো request নিতে পারে)
  # profile "full" — default `up` এ ওঠে না (local dev-এ API VS/dotnet থেকে চালাও)।
  # full stack: docker compose --profile full up -d --build
  api1:
    <<: *api-common
    container_name: aiplatform-api1
    profiles: ["full"]

  api2:
    <<: *api-common
    container_name: aiplatform-api2
    profiles: ["full"]

  nginx:
    image: nginx:alpine
    container_name: aiplatform-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    profiles: ["full"]
    restart: unless-stopped

volumes:
  sqlserver-data:
  redis-data:
  qdrant-data:
