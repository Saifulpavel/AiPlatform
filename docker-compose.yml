# Full stack: sqlserver + redis + qdrant + api×2 (replica) + nginx LB।
# চালাও: docker compose up -d --build   →  LB entry: http://localhost:8080
# শুধু backing services চাই (local dev)? docker-compose.override.yml দেখো।

# দুই API replica-র shared config (DRY — YAML anchor)
x-api-common: &api-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment:
    ASPNETCORE_ENVIRONMENT: Production
    ConnectionStrings__Default: "Server=sqlserver,1433;Database=AiPlatform;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
    Redis__Connection: "redis:6379"
    Qdrant__Url: "http://qdrant:6333"
    Jwt__SecretKey: "${JWT_SECRET}"
  depends_on:
    sqlserver:
      condition: service_healthy
    redis:
      condition: service_healthy
    qdrant:
      condition: service_started
  restart: unless-stopped

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aiplatform-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aiplatform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: aiplatform-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage

  # stateless API — দুই replica (state Redis/SQL-এ, তাই যেকোনো replica যেকোনো request নিতে পারে)
  api1:
    <<: *api-common
    container_name: aiplatform-api1

  api2:
    <<: *api-common
    container_name: aiplatform-api2

  nginx:
    image: nginx:alpine
    container_name: aiplatform-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
    restart: unless-stopped

volumes:
  sqlserver-data:
  redis-data:
  qdrant-data:
